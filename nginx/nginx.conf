worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream gateway_backend {
        least_conn;
        server app1:8080 max_fails=3 fail_timeout=10s;
        server app2:8080 max_fails=3 fail_timeout=10s;
        server app3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway_backend;

            # The LB must not silently re-send a payment POST to another instance.
            # Retries are the client's job, made safe by the idempotency key.
            proxy_next_upstream off;

            proxy_connect_timeout 3s;
            proxy_read_timeout    35s;   # a bit above the 30s Redis lock TTL
            proxy_send_timeout    35s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Idempotency-Key   $http_idempotency_key;
        }
    }
}
